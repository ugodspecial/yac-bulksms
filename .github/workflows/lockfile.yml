name: Lockfile

# Generates composer.lock and commits it to the current branch.
# Kept as a manual tool: run it from the Actions tab when dependencies change.
on:
  push:
    branches:
      - 'arena/8acd432e-yac-bulksms'
    paths:
      - 'composer.json'
      - '.github/workflows/lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    name: Generate composer.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, zip, xml, xmlreader, xmlwriter, simplexml, dom, curl, fileinfo, bcmath, gd, iconv
          coverage: none

      - name: Resolve dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Commit the lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock is already up to date."
            exit 0
          fi
          git commit -m "chore(deps): commit composer.lock resolved for PHP 8.2"
          git push origin "HEAD:${{ github.ref_name }}"
