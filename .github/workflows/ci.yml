name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  tests:
    name: PHP 8.3 · tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, zip, xml, xmlreader, xmlwriter, simplexml, dom, curl, fileinfo, bcmath, gd, iconv
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=yac_bulksms|DB_DATABASE=$(pwd)/database/database.sqlite|" .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Bootstrap a fresh database with the seeders
        env:
          # Throwaway credentials for the ephemeral CI database only.
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: ci-only-not-a-real-secret
        run: |
          php artisan migrate:fresh --seed --force
          php artisan about --only=environment

      - name: Smoke-test the operational commands
        run: |
          php artisan campaigns:dispatch-scheduled
          php artisan campaigns:reconcile
          php artisan logs:prune --dry-run

      - name: Compile views
        run: |
          php artisan view:cache
          echo "Compiled views: $(ls storage/framework/views | wc -l)"
          for f in storage/framework/views/*.php; do
            php -l "$f" > /dev/null || { echo "INVALID COMPILED VIEW: $f"; php -l "$f" || true; }
          done

      - name: Check routes compile
        run: php artisan route:cache

      - name: Run the test suite
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-progress --colors=never 2>&1 | tee /tmp/phpunit.log

      - name: Report failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/phpunit.log
          if [ ! -s "$LOG" ]; then
            cp storage/logs/laravel.log "$LOG" 2>/dev/null || echo 'no output captured' > "$LOG"
          fi
          awk '{ print substr($0, 1, 500) }' "$LOG" \
            | grep -v '^/home/runner' \
            | grep -v '^#[0-9]' \
            | grep -v '^/usr/' > /tmp/phpunit-trimmed.log || true
          tail -n 40 storage/logs/laravel.log >> /tmp/phpunit-trimmed.log 2>/dev/null || true
          {
            echo '--- diagnostics ---'
            grep -n 'providerTone\|oldestPendingLabel' resources/views/livewire/settings/index.blade.php || true
            for f in storage/framework/views/*.php; do
              php -l "$f" > /dev/null 2>&1 || {
                echo "INVALID COMPILED VIEW: $f"
                php -l "$f" || true
                echo "--- lines 420-500 ---"
                sed -n '420,500p' "$f"
              }
            done
          } >> /tmp/phpunit-trimmed.log 2>&1 || true
          rm -f /tmp/phpunit-part-*
          split -b 55000 /tmp/phpunit-trimmed.log /tmp/phpunit-part- || true
          for part in /tmp/phpunit-part-*; do
            [ -f "$part" ] || continue
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat "$part")" > /dev/null || echo 'could not post a failure report part'
          done

  assets:
    name: Node 20 · assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build assets
        run: npm run build
