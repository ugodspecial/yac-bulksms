name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  tests:
    name: PHP 8.3 · tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, zip, xml, xmlreader, xmlwriter, simplexml, dom, curl, fileinfo, bcmath, gd, iconv
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=yac_bulksms|DB_DATABASE=$(pwd)/database/database.sqlite|" .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Compile views
        run: php artisan view:cache

      - name: Check routes compile
        run: php artisan route:cache

      - name: Run the test suite
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-progress --colors=never 2>&1 | tee /tmp/phpunit.log

      - name: Report failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/phpunit.log
          if [ ! -s "$LOG" ]; then
            cp storage/logs/laravel.log "$LOG" 2>/dev/null || echo 'no output captured' > "$LOG"
          fi
          head -c 200000 "$LOG" > /tmp/phpunit-trimmed.log
          rm -f /tmp/phpunit-part-*
          split -b 55000 /tmp/phpunit-trimmed.log /tmp/phpunit-part- || true
          for part in /tmp/phpunit-part-*; do
            [ -f "$part" ] || continue
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat "$part")" > /dev/null || echo 'could not post a failure report part'
          done

  assets:
    name: Node 20 · assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build assets
        run: npm run build
